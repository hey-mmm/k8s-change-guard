name: Change Guard CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: gofmt (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal scripts/packaging)"
          if [ -n "$unformatted" ]; then
            echo "unformatted Go files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: gofmt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unformatted = & gofmt -l cmd internal scripts/packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            Write-Error "unformatted Go files:`n$($unformatted -join "`n")"
            exit 1
          }

      - name: go vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Synthetic scenario matrix
        run: go run ./cmd/change-guard scenario --output scenario-matrix.json

      - name: Verify knowledge hashes
        run: go run ./cmd/change-guard verify-knowledge --knowledge-dir knowledge

      - name: Shell syntax (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Deterministic Linux release artifact (Linux)
        if: runner.os == 'Linux'
        run: scripts/build-release.sh --output "$RUNNER_TEMP/k8s-change-guard.tar.gz"

      - name: Windows cross-build and packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -Go go -Output "$env:RUNNER_TEMP\k8s-change-guard.tar.gz"
