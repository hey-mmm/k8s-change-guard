[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-change-guard"
version = "0.2.0"
description = "Fail-closed release evaluation kernel for the demo Kubernetes workload"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1,<7",
  "requests>=2.31,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
change-guard = "change_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["change_guard*"]

[tool.setuptools.package-data]
change_guard = ["py.typed"]
