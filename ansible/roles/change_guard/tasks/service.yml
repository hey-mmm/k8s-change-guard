---
- name: Install the hardened systemd unit
  ansible.builtin.template:
    src: change-guard.service.j2
    dest: "/etc/systemd/system/{{ change_guard_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart change-guard

- name: Reload systemd and ensure the service is enabled and running
  ansible.builtin.systemd:
    name: "{{ change_guard_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
