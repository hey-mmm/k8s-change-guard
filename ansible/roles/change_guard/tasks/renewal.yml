---
- name: Install Go token renewal and expiry-check units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - change-guard-token-renew.service
    - change-guard-token-renew.timer
    - change-guard-token-check.service
    - change-guard-token-check.timer
  register: change_guard_renew_units

- name: Reload renewal units when changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: change_guard_renew_units.changed

- name: Enable fixed token renewal timer
  ansible.builtin.systemd_service:
    name: change-guard-token-renew.timer
    enabled: true
    state: started

- name: Enable token expiry monitoring timer
  ansible.builtin.systemd_service:
    name: change-guard-token-check.timer
    enabled: true
    state: started
